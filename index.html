
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据搜索工具</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0f4f8; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
.topbar { background: #0277bd; color: #fff; padding: 11px 18px; display: flex; align-items: center; gap: 10px; }
.topbar h1 { font-size: 17px; font-weight: 800; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.topbar span { font-size: 12px; font-weight: 500; opacity: 0.85; }
.btn-clear-data { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; color: #fff; font-size: 11.5px; font-weight: 700; padding: 3px 10px; cursor: pointer; font-family: inherit; }
.btn-clear-data:hover { background: rgba(255,255,255,0.28); }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 16px; padding: 28px; width: 90%; max-width: 640px; box-shadow: 0 8px 40px rgba(0,0,0,0.22); }
.modal h2 { font-size: 16px; font-weight: 800; color: #0277bd; margin-bottom: 6px; }
.modal p { font-size: 12.5px; color: #667; margin-bottom: 12px; font-weight: 600; line-height: 1.6; }
.modal textarea { width: 100%; height: 160px; border: 1.5px solid #c5d8e8; border-radius: 10px; padding: 10px 12px; font-size: 12px; font-family: 'Courier New', monospace; resize: vertical; outline: none; color: #222; background: #f5faff; }
.modal textarea:focus { border-color: #0277bd; }
.modal-btns { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
.btn-primary { background: #0277bd; color: #fff; border: none; border-radius: 10px; padding: 8px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.15s; }
.btn-primary:hover { background: #01579b; }
.btn-primary:disabled { background: #90caf9; cursor: not-allowed; }
.btn-secondary { background: #f0f4f8; color: #667; border: 1.5px solid #c5d8e8; border-radius: 10px; padding: 8px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.sep { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
.sep span { font-size: 11px; color: #aac; font-weight: 700; white-space: nowrap; }
.sep hr { flex: 1; border: none; border-top: 1px solid #e0eaf2; }
.file-label { display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px dashed #81d4fa; border-radius: 10px; padding: 14px; cursor: pointer; color: #0277bd; font-weight: 700; font-size: 13px; background: #f0f9ff; transition: all 0.15s; }
.file-label:hover { background: #e1f5fe; border-color: #0277bd; }
#fileInputModal { display: none; }
.fmt-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.fmt-tab { border: 1.5px solid #c5d8e8; background: #f5faff; border-radius: 8px; padding: 4px 14px; font-size: 12px; font-weight: 700; cursor: pointer; color: #667; font-family: inherit; }
.fmt-tab.active { background: #0277bd; border-color: #0277bd; color: #fff; }
.progress-wrap { margin-top: 12px; display: none; }
.progress-wrap.show { display: block; }
.progress-bar-bg { background: #e1f5fe; border-radius: 8px; height: 10px; overflow: hidden; }
.progress-bar-fill { background: #0277bd; height: 100%; border-radius: 8px; width: 0%; transition: width 0.15s; }
.progress-label { font-size: 11.5px; color: #0277bd; font-weight: 700; margin-top: 5px; text-align: center; }
.filter-bar { background: #fff; border-bottom: 2.5px solid #0277bd; padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 8px rgba(0,0,0,0.09); }
.fg { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 150px; }
.fg label { font-size: 10.5px; font-weight: 800; color: #0277bd; text-transform: uppercase; letter-spacing: 0.08em; }
.fg input { border: 1.5px solid #c5d8e8; border-radius: 10px; padding: 6px 12px; font-size: 13px; color: #222; background: #f5faff; outline: none; font-family: inherit; font-weight: 600; transition: border-color 0.15s; }
.fg input:focus { border-color: #0277bd; box-shadow: 0 0 0 3px rgba(2,119,189,0.13); background: #fff; }
.fg input::placeholder { font-weight: 400; color: #aac4d8; }
.btn-clear { background: #e1f5fe; border: 1.5px solid #81d4fa; border-radius: 10px; padding: 6px 16px; font-size: 12.5px; color: #01579b; cursor: pointer; font-weight: 700; align-self: flex-end; font-family: inherit; }
.btn-clear:hover { background: #b3e5fc; }
.upload-bar { background: #f7f9fc; border-bottom: 1px solid #dde3ea; padding: 9px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.upload-btn { background: #0277bd; color: #fff; border: none; border-radius: 10px; padding: 6px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; }
.upload-btn:hover { background: #01579b; }
.upload-name { font-size: 12.5px; color: #0277bd; font-weight: 700; }
.saved-badge { background: #e0f7fa; color: #006064; border: 1px solid #80deea; border-radius: 8px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; }
.stats { margin-left: auto; font-size: 12px; color: #667; font-weight: 600; }
.stats strong { color: #111; font-weight: 800; }
.tbl-outer { overflow: auto; max-height: calc(100vh - 165px); border-top: 1px solid #ccd6e0; }
table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; background: #fff; }
thead tr th { background: #0277bd; color: #fff; font-weight: 800; padding: 8px 11px; border: 1px solid #01579b; white-space: nowrap; position: sticky; top: 0; z-index: 10; text-align: left; font-size: 12px; cursor: pointer; user-select: none; font-family: inherit; }
thead tr th:hover { background: #01579b; }
th.rn, td.rn { background: #e1f5fe !important; color: #5580a0 !important; font-size: 11px; text-align: center; min-width: 36px; max-width: 36px; border-color: #b3e5fc !important; font-weight: 600 !important; cursor: default !important; }
th.rn { background: #b3e5fc !important; color: #01579b !important; font-weight: 800 !important; }
tbody tr td { padding: 6px 11px; border: 1px solid #d0dce8; color: #2a3a4a; vertical-align: top; white-space: pre-wrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; max-height: 80px; }
tbody tr td.nowrap { white-space: nowrap; vertical-align: middle; }
tbody tr:nth-child(even) td { background: #f0f8ff; }
tbody tr:nth-child(odd) td { background: #fff; }
tbody tr:hover td { background: #dff0fb !important; }
tbody tr.selected td { background: #b3e5fc !important; }
.c-asin { font-family: 'Courier New', monospace; font-size: 11.5px; color: #0d47a1; font-weight: 700; }
.c-link a { color: #0277bd; text-decoration: underline; font-size: 12px; font-weight: 700; }
.c-link a:hover { color: #01579b; }
.c-img img { width: 40px; height: 40px; object-fit: cover; border: 1px solid #dde8f0; border-radius: 5px; }
.c-img .noimg { width: 40px; height: 40px; background: #eef4fb; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; color: #aac; border: 1px solid #dde3ea; border-radius: 5px; }
.c-pt { background: #e0f7fa; color: #006064; padding: 2px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 700; border: 1px solid #80deea; display: inline-block; white-space: nowrap; }
.c-kw { color: #5c35a0; font-size: 12.5px; font-weight: 600; }
.empty-row td { text-align: center; padding: 44px; color: #b0c4d4; font-size: 13.5px; font-weight: 600; background: #fff !important; }
.pager { background: #f7f9fc; border-top: 1px solid #dde3ea; padding: 8px 18px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pg-btn { border: 1.5px solid #c5d8e8; background: #fff; border-radius: 8px; padding: 4px 12px; font-size: 12.5px; color: #334; cursor: pointer; font-family: inherit; font-weight: 700; }
.pg-btn:hover { background: #e1f5fe; border-color: #0277bd; color: #0277bd; }
.pg-btn.active { background: #0277bd; border-color: #0277bd; color: #fff; }
.pg-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.pg-info { font-size: 12px; color: #99aabb; margin-left: 8px; font-weight: 600; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0277bd; color: #fff; padding: 10px 24px; border-radius: 20px; font-weight: 700; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
    <rect width="22" height="22" rx="6" fill="rgba(255,255,255,0.2)"/>
    <circle cx="9.5" cy="9.5" r="4" stroke="white" stroke-width="1.8" fill="none"/>
    <line x1="13" y1="13" x2="18" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <h1>数据搜索工具</h1>
  <div class="topbar-right">
    <span id="headerCount">共 0 条记录</span>
    <button class="btn-clear-data" onclick="clearSavedData()">�� 清除数据</button>
  </div>
</div>

<div class="filter-bar">
  <div class="fg"><label>�� Keywords</label><input type="text" id="fKw" placeholder="搜索关键词..." oninput="applyFilters()"></div>
  <div class="fg"><label>�� ASIN</label><input type="text" id="fAsin" placeholder="输入 ASIN..." oninput="applyFilters()"></div>
  <div class="fg"><label>��️ PT (Product Type)</label><input type="text" id="fPt" placeholder="输入 PT 类型..." oninput="applyFilters()"></div>
  <button class="btn-clear" onclick="clearFilters()">✕ 清除筛选</button>
</div>

<div class="upload-bar">
  <button class="upload-btn" onclick="openModal()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 1v8M4 4l3-3 3 3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 11h12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    导入 / 更新数据
  </button>
  <span id="uploadName" class="upload-name"></span>
  <span id="savedBadge" class="saved-badge" style="display:none">�� 已缓存</span>
  <div class="stats">显示 <strong id="showCount">0</strong> / <strong id="totalCount">0</strong> 条 &nbsp;|&nbsp; 第 <strong id="pgCur">—</strong> / <strong id="pgTotal">—</strong> 页</div>
</div>

<div class="tbl-outer" id="tblOuter">
  <table>
    <thead>
      <tr>
        <th class="rn">#</th>
        <th>图片</th>
        <th onclick="sortBy('asin')">ASIN ⇅</th>
        <th onclick="sortBy('title')">Title ⇅</th>
        <th onclick="sortBy('keywords')">Keywords ⇅</th>
        <th onclick="sortBy('product_type')">PT ⇅</th>
        <th onclick="sortBy('question')">Question ⇅</th>
        <th onclick="sortBy('ri_comment')">RI Comment ⇅</th>
        <th onclick="sortBy('comment')">Comment ⇅</th>
        <th onclick="sortBy('tt_link')">TT Link</th>
        <th onclick="sortBy('pt_qrd_link')">PT QRD Link</th>
      </tr>
    </thead>
    <tbody id="tblBody">
      <tr class="empty-row"><td colspan="11">�� 点击「导入 / 更新数据」按钮加载数据</td></tr>
    </tbody>
  </table>
</div>
<div class="pager" id="pager"></div>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg" onclick="bgClick(event)">
  <div class="modal">
    <h2>�� 导入 / 更新数据</h2>
    <p>方式一：直接选择本地文件（CSV / TSV / JSON）</p>
    <label class="file-label" for="fileInputModal">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M9 2v10M5 6l4-4 4 4" stroke="#0277bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 14h14" stroke="#0277bd" stroke-width="2" stroke-linecap="round"/>
      </svg>
      点击选择文件
    </label>
    <input type="file" id="fileInputModal" accept=".csv,.tsv,.json,.txt">
    <div class="sep"><hr><span>或者</span><hr></div>
    <p>方式二：用记事本打开文件 → Ctrl+A → Ctrl+C → 粘贴到下方</p>
    <div class="fmt-tabs">
      <button class="fmt-tab active" onclick="setFmt('csv',this)">CSV（逗号）</button>
      <button class="fmt-tab" onclick="setFmt('tsv',this)">TSV（Tab）</button>
      <button class="fmt-tab" onclick="setFmt('json',this)">JSON</button>
    </div>
    <textarea id="pasteArea" placeholder="在此粘贴数据内容..."></textarea>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">处理中...</div>
    </div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-primary" id="importBtn" onclick="loadData()">✓ 确认导入</button>
    </div>
  </div>
</div>

<script>
var allData=[], filteredData=[], currentPage=1, PAGE=50, sortCol='', sortAsc=true, fmt='csv';
var STORAGE_KEY='escalate_tool_v4';

var COL_MAP={
  'tt_link':'tt_link','ttlink':'tt_link','ctlink':'tt_link','ct_link':'tt_link',
  'asin':'asin',
  'img_url':'img_url','imgurl':'img_url','imageurl':'img_url','image_url':'img_url',
  'keywords':'keywords','keyword':'keywords',
  'question':'question',
  'ri_comment':'ri_comment','ricomment':'ri_comment',
  'comment':'comment',
  'product_type':'product_type','producttype':'product_type','pt':'product_type',
  'title':'title',
  'pt_qrd_link':'pt_qrd_link','ptqrdlink':'pt_qrd_link','pt_grid_link':'pt_qrd_link'
};
var SKIP_COLS={'no':1,'#':1,'index':1,'row':1,'ct':1,'num':1,'number':1,
               'create_user':1,'createuser':1,'createdby':1,'created_by':1};

function mapCol(h){
  var raw=String(h).trim();
  var clean=raw.toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(!clean||SKIP_COLS[clean]) return null;
  return COL_MAP[clean]||raw.toLowerCase().replace(/\s+/g,'_');
}

// ══════════════════════════════════════════════
// 核心修复：真正的 CSV 状态机解析器
// 逐字符扫描整个文本，正确处理引号内的换行符
// 不再先 split('\n') 再解析，彻底解决多行字段错位问题
// ══════════════════════════════════════════════
function parseCSV(txt, sep) {
  var rows = [];
  var cur = '';
  var inQ = false;
  var fields = [];
  var i = 0;
  var len = txt.length;

  while (i < len) {
    var c = txt[i];

    if (c === '"') {
      if (inQ) {
        // 检查是否是转义引号 ""
        if (i + 1 < len && txt[i+1] === '"') {
          cur += '"';
          i += 2;
          continue;
        } else {
          inQ = false;
        }
      } else {
        inQ = true;
      }
      i++;
    } else if (c === sep && !inQ) {
      fields.push(cur.trim());
      cur = '';
      i++;
    } else if ((c === '\n' || (c === '\r' && txt[i+1] === '\n')) && !inQ) {
      // 行结束（引号外的换行才算真正的行分隔）
      if (c === '\r') i++; // 跳过 \r
      fields.push(cur.trim());
      cur = '';
      if (fields.some(function(f){ return f !== ''; })) {
        rows.push(fields);
      }
      fields = [];
      i++;
    } else if (c === '\r' && !inQ) {
      i++; // 单独的 \r 跳过
    } else {
      cur += c;
      i++;
    }
  }
  // 最后一行
  fields.push(cur.trim());
  if (fields.some(function(f){ return f !== ''; })) {
    rows.push(fields);
  }

  return rows;
}

function parseTSV(txt) {
  // TSV 同样用状态机，但分隔符是 Tab，且引号内换行同样保留
  return parseCSV(txt, '\t');
}

function detectSep(txt) {
  // 只看第一行（引号外）来判断分隔符
  var tabs = 0, commas = 0, inQ = false;
  for (var i = 0; i < Math.min(txt.length, 2000); i++) {
    var c = txt[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (inQ) continue;
    if (c === '\n') break;
    if (c === '\t') tabs++;
    if (c === ',') commas++;
  }
  return tabs > commas ? '\t' : ',';
}

function rowsToObjects(rows) {
  if (rows.length < 2) return [];
  var hdrs = rows;
  var colMap = hdrs.map(function(h){ return mapCol(h); });
  var result = [];
  for (var i = 1; i < rows.length; i++) {
    var vals = rows[i];
    var obj = {};
    for (var j = 0; j < colMap.length; j++) {
      if (colMap[j] !== null) {
        obj[colMap[j]] = (vals[j] !== undefined ? String(vals[j]) : '');
      }
    }
    result.push(obj);
  }
  return result;
}

// ── localStorage ──
window.onload = function(){
  try{
    var saved=localStorage.getItem(STORAGE_KEY);
    if(saved){
      var parsed=JSON.parse(saved);
      if(parsed&&parsed.data&&parsed.data.length>0){
        allData=parsed.data;
        document.getElementById('uploadName').textContent='✓ '+(parsed.name||'已保存数据');
        document.getElementById('savedBadge').style.display='inline-block';
        applyFilters();
        showToast('✅ 已自动恢复 '+allData.length+' 条数据');
      }
    }
  }catch(e){ localStorage.removeItem(STORAGE_KEY); }
};

function saveToStorage(name){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({name:name, data:allData}));
    document.getElementById('savedBadge').style.display='inline-block';
  }catch(e){
    showToast('⚠️ 数据量过大无法缓存，每次需重新导入');
  }
}

function clearSavedData(){
  if(!confirm('确定要清除所有缓存数据吗？')) return;
  localStorage.removeItem(STORAGE_KEY);
  allData=[];filteredData=[];
  document.getElementById('uploadName').textContent='';
  document.getElementById('savedBadge').style.display='none';
  applyFilters();
  showToast('�� 数据已清除');
}

// ── 文件选择 ──
document.getElementById('fileInputModal').onchange=function(e){
  var file=e.target.files;
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var txt=String(ev.target.result||'');
    setProgress(10,'读取文件...');
    setTimeout(function(){
      try{
        processText(txt, file.name.split('.').pop().toLowerCase(), file.name);
      }catch(err){ showToast('❌ 解析失败: '+err.message); hideProgress(); }
    },30);
  };
  reader.onerror=function(){ showToast('❌ 读取失败，请用粘贴方式'); };
  reader.readAsText(file,'UTF-8');
};

function setFmt(f,btn){
  fmt=f;
  document.querySelectorAll('.fmt-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
}

function loadData(){
  var raw=document.getElementById('pasteArea').value;
  if(!raw||!raw.trim()){showToast('⚠️ 请先选择文件或粘贴数据');return;}
  var btn=document.getElementById('importBtn');
  btn.disabled=true; btn.textContent='处理中...';
  setProgress(10,'解析中...');
  setTimeout(function(){
    try{
      processText(String(raw), fmt, '粘贴数据');
    }catch(err){
      showToast('❌ 解析失败: '+err.message);
      hideProgress();
      btn.disabled=false; btn.textContent='✓ 确认导入';
    }
  },30);
}

function processText(txt, ext, name){
  var rows;
  setProgress(30,'解析结构...');
  if(ext==='json'){
    allData=JSON.parse(txt);
    if(!Array.isArray(allData)) allData=[allData];
  } else if(ext==='tsv'){
    rows=parseTSV(txt);
    allData=rowsToObjects(rows);
  } else {
    // CSV 或自动检测
    var sep = (ext==='csv') ? ',' : detectSep(txt);
    rows=parseCSV(txt, sep);
    allData=rowsToObjects(rows);
  }
  setProgress(90,'渲染数据...');
  setTimeout(function(){
    finishLoad(name);
  },30);
}

function finishLoad(name){
  document.getElementById('uploadName').textContent='✓ '+name+'（'+allData.length+' 条）';
  hideProgress();
  var btn=document.getElementById('importBtn');
  btn.disabled=false; btn.textContent='✓ 确认导入';
  saveToStorage(name);
  closeModal();
  applyFilters();
  showToast('✓ 已加载并缓存 '+allData.length+' 条数据');
}

function openModal(){document.getElementById('modalBg').classList.add('open');document.getElementById('pasteArea').value='';document.getElementById('fileInputModal').value='';}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}
function bgClick(e){if(e.target===document.getElementById('modalBg'))closeModal();}

function applyFilters(){
  var kw=document.getElementById('fKw').value.trim().toLowerCase();
  var asin=document.getElementById('fAsin').value.trim().toLowerCase();
  var pt=document.getElementById('fPt').value.trim().toLowerCase();
  filteredData=allData.filter(function(r){
    if(kw&&!(r.keywords||'').toLowerCase().includes(kw)) return false;
    if(asin&&!(r.asin||'').toLowerCase().includes(asin)) return false;
    if(pt&&!(r.product_type||'').toLowerCase().includes(pt)) return false;
    return true;
  });
  if(sortCol) doSort();
  currentPage=1; render();
}
function clearFilters(){document.getElementById('fKw').value='';document.getElementById('fAsin').value='';document.getElementById('fPt').value='';applyFilters();}
function sortBy(col){if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true;}doSort();currentPage=1;render();}
function doSort(){filteredData.sort(function(a,b){var va=(a[sortCol]||'').toLowerCase(),vb=(b[sortCol]||'').toLowerCase();return sortAsc?va.localeCompare(vb):vb.localeCompare(va);});}

function render(){
  var total=filteredData.length, pages=Math.max(1,Math.ceil(total/PAGE));
  if(currentPage>pages) currentPage=pages;
  var start=(currentPage-1)*PAGE, slice=filteredData.slice(start,start+PAGE);
  document.getElementById('totalCount').textContent=allData.length;
  document.getElementById('showCount').textContent=total;
  document.getElementById('pgCur').textContent=pages>0?currentPage:'—';
  document.getElementById('pgTotal').textContent=pages>0?pages:'—';
  document.getElementById('headerCount').textContent='共 '+allData.length+' 条记录';
  var tbody=document.getElementById('tblBody');
  if(slice.length===0){tbody.innerHTML='<tr class="empty-row"><td colspan="11">未找到匹配数据</td></tr>';renderPager(pages);return;}
  var rows='';
  for(var i=0;i<slice.length;i++){
    var r=slice[i], n=start+i+1;
    var img=r.img_url||'', asin=r.asin||'', ttl=r.title||'', kw=r.keywords||'';
    var pt=r.product_type||'', q=r.question||'', ri=r.ri_comment||'';
    var cm=r.comment||'', tt=r.tt_link||'', pq=r.pt_qrd_link||'';

    var imgCell=img
      ?'<div class="c-img"><img src="'+x(img)+'" alt="" onerror="this.parentNode.innerHTML=\'<div class=noimg>N/A</div>\'"></div>'
      :'<div class="c-img"><div class="noimg">N/A</div></div>';

    var ttCell='';
    if(tt){
      var ttUrl=tt.trim();
      if(ttUrl.indexOf('http')!==0) ttUrl='https://'+ttUrl;
      ttCell='<div class="c-link"><a href="'+x(ttUrl)+'" target="_blank" rel="noopener">�� 链接</a></div>';
    }
    var pqCell='';
    if(pq){
      var pqUrl=pq.trim();
      if(pqUrl.indexOf('http')!==0) pqUrl='https://'+pqUrl;
      pqCell='<div class="c-link"><a href="'+x(pqUrl)+'" target="_blank" rel="noopener">�� 链接</a></div>';
    }

    rows+='<tr onclick="selRow(this)">'
      +'<td class="rn nowrap">'+n+'</td>'
      +'<td class="nowrap">'+imgCell+'</td>'
      +'<td class="c-asin nowrap" title="'+x(asin)+'">'+x(asin)+'</td>'
      +'<td class="nowrap" title="'+x(ttl)+'">'+x(ttl)+'</td>'
      +'<td class="c-kw nowrap" title="'+x(kw)+'">'+x(kw)+'</td>'
      +'<td class="nowrap">'+(pt?'<span class="c-pt">'+x(pt)+'</span>':'')+'</td>'
      +'<td title="'+x(q)+'">'+x(q)+'</td>'
      +'<td title="'+x(ri)+'">'+x(ri)+'</td>'
      +'<td title="'+x(cm)+'">'+x(cm)+'</td>'
      +'<td class="nowrap">'+ttCell+'</td>'
      +'<td class="nowrap">'+pqCell+'</td>'
      +'</tr>';
  }
  tbody.innerHTML=rows;
  renderPager(pages);
}

function selRow(tr){document.querySelectorAll('#tblBody tr.selected').forEach(function(r){r.classList.remove('selected');});tr.classList.add('selected');}

function renderPager(pages){
  var pg=document.getElementById('pager');
  if(pages<=1){pg.innerHTML='';return;}
  var h='<button class="pg-btn" onclick="goPage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>‹ 上一页</button>';
  var range=[];
  for(var i=1;i<=pages;i++){if(i===1||i===pages||(i>=currentPage-2&&i<=currentPage+2))range.push(i);else if(range[range.length-1]!=='…')range.push('…');}
  range.forEach(function(p){if(p==='…')h+='<span style="padding:0 5px;color:#b0c4d4">…</span>';else h+='<button class="pg-btn '+(p===currentPage?'active':'')+'" onclick="goPage('+p+')">'+p+'</button>';});
  h+='<button class="pg-btn" onclick="goPage('+(currentPage+1)+')" '+(currentPage===pages?'disabled':'')+'>下一页 ›</button>';
  h+='<span class="pg-info">每页 '+PAGE+' 条</span>';
  pg.innerHTML=h;
}
function goPage(p){var pages=Math.ceil(filteredData.length/PAGE);if(p<1||p>pages)return;currentPage=p;render();document.getElementById('tblOuter').scrollTop=0;}
function x(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setProgress(pct,label){document.getElementById('progressWrap').classList.add('show');document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressLabel').textContent=label;}
function hideProgress(){document.getElementById('progressWrap').classList.remove('show');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}
</script>
</body>
</html>
